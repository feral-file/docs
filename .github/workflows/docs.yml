name: build-docs

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - name: Validate mobile changelog contract
        run: |
          python -m unittest tests/test_validate_mobile_changelog.py
          python scripts/validate_mobile_changelog.py docs/changelog.md
      - run: mkdocs build --strict
      - name: Verify raw mobile changelog
        run: cmp docs/changelog.md site/docs/changelog.md
