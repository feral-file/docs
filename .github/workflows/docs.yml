name: build-docs

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - name: Verify raw changelog
        run: cmp docs/changelog.md site/docs/changelog.md
      - name: Verify Markdown twins
        run: python3 scripts/check-twins.py site
