site_name: Feral File Docs
site_url: https://docs.feralfile.com
# No repo_url: the custom header in overrides/main.html does not show Material's
# repository link. The source repo is public and linked from docs/open-source.md.
theme:
  name: material
  custom_dir: overrides
  # PP Mori and Space Mono are self-hosted in docs/fonts and declared in
  # stylesheets/extra.css. `false` stops Material from pulling Google Fonts.
  font: false
  logo: images/feralfile-symbol.svg
  palette:
    scheme: slate
    # Without this Material stamps data-md-color-primary="indigo" on <body>,
    # which is what tints the drawer's repo card. Brand colors still come from
    # stylesheets/extra.css.
    primary: black
  features:
    - content.code.copy

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js

extra_css:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.css
  - stylesheets/extra.css
plugins:
  - search
  - redirects:
      redirect_maps:
        # Renamed 2026-05-13 (FF1 -> Art Computer / ff1-cli -> ff-cli).
        # Keep these old paths working for inbound links from search results,
        # partner docs, and previous Substack posts.
        ff1/index.md: art-computer/index.md
        ff1/specification.md: art-computer/specification.md
        ff1/how-it-works/life-cycle.md: art-computer/how-it-works/life-cycle.md
        ff1/how-it-works/display.md: art-computer/how-it-works/display.md
        ff1/how-it-works/ota.md: art-computer/how-it-works/ota.md
        ff1/how-it-works/send-playlists-to-ff1.md: ff-cli/index.md
        dp1-protocol/ff1-integration.md: ff-cli/index.md
        # Renamed 2026-05-27 (cleaner section URLs).
        api-reference/cli.md: ff-cli/index.md
        # Renamed 2026-08-05 (Website/Browser Integration -> Play on Art Computer).
        art-computer/browser-integration.md: art-computer/play.md
        dp1-protocol/feed-server.md: hosted-feed/index.md

hooks:
  - mkdocs_hooks.py

nav:
  - Home: index.md
  - Agents: agents/index.md
  - ff-cli: ff-cli/index.md
  - Art Computer:
    - Getting Started: art-computer/index.md
    - How It Works:
      - Life Cycle: art-computer/how-it-works/life-cycle.md
      - End-to-End Architecture: art-computer/how-it-works/display.md
      - OTA: art-computer/how-it-works/ota.md
    - Specification: art-computer/specification.md
    - Play on Art Computer: art-computer/play.md
    - Upgrades: art-computer/upgrades.md
    - Print Your Own Faceplates: art-computer/faceplates/index.md
    - Network Requirements: art-computer/network-requirements.md
    - Running without Feral File: art-computer/without-feral-file.md
    - Factory Reset: art-computer/factory-reset.md
  - Hosted Feed: hosted-feed/index.md
  - Open source: open-source.md
  - Contact: https://feralfile.com/legal/contact

# Pages built and served but intentionally absent from the nav.
# changelog.md is also copied verbatim to /docs/changelog.md for installed
# app readers. mkdocs_hooks.py owns that generated endpoint.
not_in_nav: |
  changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed
